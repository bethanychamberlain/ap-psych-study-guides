<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 50 figures</title>
<style>
:root { --ink: #1f2a24; --muted: #5b6b62; --rule: #d6ded9; --paper: #ffffff; --accent: #2c5f46; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink);
  font: 17px/1.55 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.5rem 16px 3rem; }
.eyebrow { font: 600 0.75rem/1.2 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0; }
h1 { font-size: 1.6rem; margin: 0.3rem 0 0.6rem; }
.lede { color: var(--muted); margin: 0 0 1.5rem; }
figure { margin: 0 0 2.2rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
h2 { font-size: 1.1rem; margin: 0 0 0.8rem; }
img { display: block; max-width: 100%; height: auto; border: 1px solid var(--rule); }
figcaption { color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem; }
a { color: var(--accent); }
</style>
</head>
<body>
<main class="wrap">
<p class="eyebrow">AP Psychology &middot; Class 50</p>
<h1>Figures from your class notes</h1>
<p class="lede">Treatment of psychological disorders. These are the same figures as in your Class Notes, in the same order. If a figure in your notes shows as a gray box, use this page instead.</p>
<figure>
<h2>Slide 13. The Thought in the Middle</h2>
<img src="figures/class50/figure1.svg" alt="Slide 13. The Thought in the Middle: Event, interpretation, emotional response, with the middle box marked as the treatment target." loading="lazy">
<figcaption>Event, interpretation, emotional response, with the middle box marked as the treatment target.</figcaption>
</figure>
<figure>
<h2>Slide 18. What Makes Therapy Work</h2>
<img src="figures/class50/figure2.svg" alt="Slide 18. What Makes Therapy Work: Evidence-based practice is the middle, where all three circles overlap." loading="lazy">
<figcaption>Evidence-based practice is the middle, where all three circles overlap.</figcaption>
</figure>
<figure>
<h2>Slide 24. What It Shows</h2>
<img src="figures/class50/figure3.svg" alt="Slide 24. What It Shows: People who waited and people who got therapy on one outcome scale; the treated curve sits to the right. Shape only, no scale: the curves are illustrative, not drawn from data." loading="lazy">
<figcaption>People who waited and people who got therapy on one outcome scale; the treated curve sits to the right. Shape only, no scale: the curves are illustrative, not drawn from data.</figcaption>
</figure>
<figure>
<h2>Slide 39. Brain Stimulation: ECT and TMS</h2>
<img src="figures/class50/figure4.png" alt="Slide 39. Brain Stimulation: ECT and TMS: **TMS coil** against the scalp. Baburov, Wikimedia Commons, CC BY-SA 4.0, cropped" loading="lazy">
<figcaption>**TMS coil** against the scalp. Baburov, Wikimedia Commons, CC BY-SA 4.0, cropped</figcaption>
</figure>

</main>
</body>
</html>
