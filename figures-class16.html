<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 16 figures</title>
<style>
:root { --ink: #1f2a24; --muted: #5b6b62; --rule: #d6ded9; --paper: #ffffff; --accent: #2c5f46; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink);
  font: 17px/1.55 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.5rem 16px 3rem; }
.eyebrow { font: 600 0.75rem/1.2 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0; }
h1 { font-size: 1.6rem; margin: 0.3rem 0 0.6rem; }
.lede { color: var(--muted); margin: 0 0 1.5rem; }
figure { margin: 0 0 2.2rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
h2 { font-size: 1.1rem; margin: 0 0 0.8rem; }
img { display: block; max-width: 100%; height: auto; border: 1px solid var(--rule); }
figcaption { color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem; }
a { color: var(--accent); }
</style>
</head>
<body>
<main class="wrap">
<p class="eyebrow">AP Psychology &middot; Class 16</p>
<h1>Figures from your class notes</h1>
<p class="lede">The neuron and neural firing: neural communication and the endocrine system. These are the same figures as in your Class Notes, in the same order. If a figure in your notes shows as a gray box, use this page instead.</p>
<figure>
<h2>Slide 7. Three Cells in the Loop</h2>
<img src="figures/class16/figure1.svg" alt="Slide 7. Three Cells in the Loop: The arc as a loop: stimulus into the spinal cord, response straight back out to the muscle." loading="lazy">
<figcaption>The arc as a loop: stimulus into the spinal cord, response straight back out to the muscle.</figcaption>
</figure>
<figure>
<h2>Slide 8. The Firing Sequence</h2>
<img src="figures/class16/figure2.svg" alt="Slide 8. The Firing Sequence: Shape only, no scale: the gap between resting potential and threshold, and the bump and spike heights, are schematic, not to physiological proportion." loading="lazy">
<figcaption>Shape only, no scale: the gap between resting potential and threshold, and the bump and spike heights, are schematic, not to physiological proportion.</figcaption>
</figure>
<figure>
<h2>Slide 10. Refractory Period and Reuptake</h2>
<img src="figures/class16/figure3.jpg" alt="Slide 10. Refractory Period and Reuptake: OpenStax, Psychology 2e, Figure 3.12, CC BY 4.0" loading="lazy">
<figcaption>OpenStax, Psychology 2e, Figure 3.12, CC BY 4.0</figcaption>
</figure>
<figure>
<h2>Slide 29. Reading a Melatonin Curve</h2>
<img src="figures/class16/figure4.svg" alt="Slide 29. Reading a Melatonin Curve: Illustrative, not to scale: low through the day, rising in the evening, peaking in the small hours, falling sharply before waking." loading="lazy">
<figcaption>Illustrative, not to scale: low through the day, rising in the evening, peaking in the small hours, falling sharply before waking.</figcaption>
</figure>

</main>
</body>
</html>
