<style>
:root { --ink: #1f2a24; --muted: #5b6b62; --rule: #d6ded9; --paper: #ffffff; --accent: #2c5f46; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink);

img { display: block; max-width: 100%; height: auto; border: 1px solid var(--rule); }

<figcaption>Read panel (a): the left and right hemispheres, joined by the corpus callosum. Panels (b) and (c) show the same band from the side and in a dissected brain. OpenStax, Psychology 2e, Figure 3.16, CC BY 4.0. Credit (c): modification of work by Aaron Bornstein.</figcaption>

<figure>
<h2>Slide 20. How It Was Designed</h2>
<img src="figures/class18/figure8.svg" alt="Slide 20. How It Was Designed: These patients have had the corpus callosum cut, so this is not ordinary anatomy. Each visual field crosses to the opposite hemisphere, which is why what is flashed to the left field reaches the right hemisphere and stops there." loading="lazy">
<figcaption>These patients have had the corpus callosum cut, so this is not ordinary anatomy. Each visual field crosses to the opposite hemisphere, which is why what is flashed to the left field reaches the right hemisphere and stops there.</figcaption>
</figure>
<figure>
<h2>Slide 27. When the Brain Is Damaged</h2>
<img src="figures/class18/figure9.svg" alt="Slide 27. When the Brain Is Damaged: After injury to the original hand-movement site (gray, damaged), the job is reassigned to healthy tissue beside it (green). The arrow runs from the lost site to the tissue that takes over." loading="lazy">
<figcaption>After injury to the original hand-movement site (gray, damaged), the job is reassigned to healthy tissue beside it (green). The arrow runs from the lost site to the tissue that takes over.</figcaption>
</figure>
<figure>
<h2>Slide 30. What Split-Brain Research Showed</h2>
<img src="figures/class18/figure10.svg" alt="Slide 30. What Split-Brain Research Showed: A schematic of tendencies, not two separate brains. In anyone whose corpus callosum is intact the two sides are in contact constantly." loading="lazy">
<figcaption>A schematic of tendencies, not two separate brains. In anyone whose corpus callosum is intact the two sides are in contact constantly.</figcaption>
</figure>

<figcaption>In most people both areas sit in the left hemisphere: Broca&#x27;s area in the frontal lobe, Wernicke&#x27;s area in the temporal lobe. OpenStax, Psychology 2e, Figure 3.21, CC BY 4.0</figcaption>
