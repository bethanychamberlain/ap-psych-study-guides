<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
<rect x="0" y="0" width="1400" height="900" fill="#FFFFFF"/>

<!-- axes: horizontal outcome (worse to better), vertical number of people, no numbers -->
<line x1="150" y1="680" x2="1300" y2="680" stroke="#2F5D3A" stroke-width="6" stroke-linecap="round"/>
<polygon points="1330,680 1296,662 1296,698" fill="#2F5D3A"/>
<line x1="150" y1="680" x2="150" y2="130" stroke="#2F5D3A" stroke-width="6" stroke-linecap="round"/>
<polygon points="150,100 132,134 168,134" fill="#2F5D3A"/>

<!-- right curve: people who got therapy, shifted right, filled forest wash -->
<path d="M540,680 C675,680 795,300 840,300 C885,300 1005,680 1140,680 Z" fill="#2F5D3A" fill-opacity="0.18" stroke="#2F5D3A" stroke-width="7" stroke-linejoin="round"/>

<!-- the overlap: shaded lens where both curves cover the same outcomes -->
<path d="M540,680 C610,680 650,510 710,510 C770,510 810,680 910,680 Z" fill="#B8862B" fill-opacity="0.22"/>

<!-- left curve: people who waited, muted outline only -->
<path d="M210,680 C368,680 508,300 560,300 C612,300 752,680 910,680" fill="none" stroke="#6B6459" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

<!-- dashed line through the treated curve's peak, also cutting the untreated curve's tail -->
<line x1="840" y1="295" x2="840" y2="680" stroke="#1F1D1A" stroke-width="5" stroke-dasharray="16,12"/>

<!-- axis titles -->
<text x="725" y="770" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#1F1D1A" text-anchor="middle">outcome</text>
<text x="0" y="0" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#1F1D1A" text-anchor="middle" transform="translate(75,405) rotate(-90)">number of people</text>

<!-- axis endpoint tags -->
<text x="170" y="715" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#6B6459" text-anchor="start">worse</text>
<text x="1280" y="715" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#6B6459" text-anchor="end">better</text>

<!-- curve identity labels, offset so the two do not collide -->
<text x="430" y="265" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#6B6459" text-anchor="middle">people who waited</text>
<text x="970" y="265" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#2F5D3A" text-anchor="middle">people who got therapy</text>

<!-- overlap label -->
<text x="680" y="630" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#B8862B" text-anchor="middle">the overlap</text>

<!-- the 80 percent callout, tied to the dashed line at the treated peak -->
<text x="840" y="90" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1F1D1A" text-anchor="middle">the typical treated person</text>
<text x="840" y="138" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1F1D1A" text-anchor="middle">finished ahead of 80 percent</text>
<text x="840" y="186" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1F1D1A" text-anchor="middle">of those who waited</text>
</svg>
