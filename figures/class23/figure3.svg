<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>
<line x1="700" y1="70" x2="700" y2="700" stroke="#DDE5E0" stroke-width="3"/>

<!-- LEFT PANEL: Before -->
<text x="350" y="100" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#1F1D1A" text-anchor="middle">Before</text>
<text x="350" y="140" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#6B6459" text-anchor="middle">Same neurotransmitter released</text>
<text x="350" y="175" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#6B6459" text-anchor="middle">few receptor sites catch it</text>
<text x="350" y="215" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A" text-anchor="middle">Sending neuron</text>
<rect x="200" y="230" width="300" height="100" rx="45" fill="#2F5D3A"/>
<line x1="350" y1="330" x2="350" y2="450" stroke="#DDE5E0" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="230" cy="390" r="15" fill="#B8862B"/>
<circle cx="290" cy="390" r="15" fill="#B8862B"/>
<circle cx="350" cy="390" r="15" fill="#B8862B"/>
<circle cx="410" cy="390" r="15" fill="#B8862B"/>
<circle cx="470" cy="390" r="15" fill="#B8862B"/>
<rect x="200" y="450" width="300" height="100" rx="45" fill="#2F5D3A"/>
<circle cx="250" cy="450" r="13" fill="#1F1D1A"/>
<circle cx="350" cy="450" r="13" fill="#1F1D1A"/>
<circle cx="450" cy="450" r="13" fill="#1F1D1A"/>
<text x="350" y="600" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A" text-anchor="middle">Receiving neuron</text>
<text x="350" y="655" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A" text-anchor="middle">Receptor sites</text>

<!-- RIGHT PANEL: After -->
<text x="1050" y="100" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#1F1D1A" text-anchor="middle">After</text>
<text x="1050" y="140" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#6B6459" text-anchor="middle">Same neurotransmitter released</text>
<text x="1050" y="175" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#6B6459" text-anchor="middle">more receptor sites catch it</text>
<text x="1050" y="215" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A" text-anchor="middle">Sending neuron</text>
<rect x="900" y="230" width="300" height="100" rx="45" fill="#2F5D3A"/>
<line x1="1050" y1="330" x2="1050" y2="450" stroke="#DDE5E0" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="930" cy="390" r="15" fill="#B8862B"/>
<circle cx="990" cy="390" r="15" fill="#B8862B"/>
<circle cx="1050" cy="390" r="15" fill="#B8862B"/>
<circle cx="1110" cy="390" r="15" fill="#B8862B"/>
<circle cx="1170" cy="390" r="15" fill="#B8862B"/>
<rect x="900" y="450" width="300" height="100" rx="45" fill="#2F5D3A"/>
<circle cx="910" cy="450" r="13" fill="#1F1D1A"/>
<circle cx="950" cy="450" r="13" fill="#1F1D1A"/>
<circle cx="990" cy="450" r="13" fill="#1F1D1A"/>
<circle cx="1030" cy="450" r="13" fill="#1F1D1A"/>
<circle cx="1070" cy="450" r="13" fill="#1F1D1A"/>
<circle cx="1110" cy="450" r="13" fill="#1F1D1A"/>
<circle cx="1150" cy="450" r="13" fill="#1F1D1A"/>
<circle cx="1190" cy="450" r="13" fill="#1F1D1A"/>
<text x="1050" y="600" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A" text-anchor="middle">Receiving neuron</text>
<text x="1050" y="655" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A" text-anchor="middle">Receptor sites</text>
</svg>
