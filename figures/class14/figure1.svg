<!-- mean bars: a short ochre bar per column, each labeled "mean" -->
<rect x="425" y="387.3" width="110" height="10" fill="#B8862B"/>
<text x="360" y="400" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#B8862B" text-anchor="end">mean</text>

<rect x="915" y="476.7" width="110" height="10" fill="#B8862B"/>
<text x="1045" y="490" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#B8862B" text-anchor="start">mean</text>

<!-- caption -->
<text x="700" y="770" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="42" font-weight="600" fill="#6B6459" text-anchor="middle">one dot = one student on one day</text>
</svg>
