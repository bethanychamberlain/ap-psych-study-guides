<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>

<!-- header band: this is a stand-in display, not the class dataset -->
<rect x="0" y="0" width="1400" height="130" fill="#DDE5E0"/>
<text x="700" y="60" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#2F5D3A" text-anchor="middle">INVENTED DATA</text>
<text x="700" y="110" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1F1D1A" text-anchor="middle">not the class dataset</text>

<!-- vertical axis: filled bar plus an arrowhead triangle, no stroked lines and no numeric ticks -->
<polygon points="187,720 193,720 193,232 187,232" fill="#2F5D3A"/>
<polygon points="190,206 176,232 204,232" fill="#2F5D3A"/>
<text x="190" y="182" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1F1D1A" text-anchor="middle">higher</text>
<text x="190" y="760" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1F1D1A" text-anchor="middle">lower</text>
<text x="70" y="476" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#1F1D1A" text-anchor="middle" transform="rotate(-90, 70, 476)">recall score</text>

<!-- left column header: days after more than 8 hours of sleep -->
<text x="480" y="168" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#6B6459" text-anchor="middle">Days after</text>
<text x="480" y="212" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#1F1D1A" text-anchor="middle">more than 8 hours</text>
<text x="480" y="248" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#6B6459" text-anchor="middle">of sleep</text>

<!-- right column header: days after less than 6 hours -->
<text x="970" y="168" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#6B6459" text-anchor="middle">Days after</text>
<text x="970" y="212" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#1F1D1A" text-anchor="middle">less than 6 hours</text>

