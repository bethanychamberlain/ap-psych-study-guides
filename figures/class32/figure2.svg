<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>

<!-- Box 1: Rolling over -->
<rect x="65" y="270" width="250" height="260" rx="16" ry="16" fill="#DDE5E0" stroke="#2F5D3A" stroke-width="3"/>
<g transform="translate(190,400)" fill="#2F5D3A" stroke="#2F5D3A">
<ellipse cx="0" cy="10" rx="48" ry="22"/>
<circle cx="-50" cy="-6" r="23"/>
<ellipse cx="-25" cy="-32" rx="10" ry="18"/>
<ellipse cx="38" cy="22" rx="22" ry="13"/>
<ellipse cx="60" cy="4" rx="13" ry="16"/>
</g>
<text font-family="Figtree, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1F1D1A" text-anchor="middle">
<tspan x="190" y="590">Rolling over</tspan>
</text>

<!-- Arrow 1 -->
<path d="M323,400 L375,400" stroke="#B8862B" stroke-width="8" fill="none" stroke-linecap="round"/>
<polygon points="375,386 397,400 375,414" fill="#B8862B"/>

<!-- Box 2: Sitting up -->
<rect x="405" y="270" width="250" height="260" rx="16" ry="16" fill="#DDE5E0" stroke="#2F5D3A" stroke-width="3"/>
<g transform="translate(530,400)" fill="#2F5D3A" stroke="#2F5D3A">
<circle cx="0" cy="-40" r="23"/>
<rect x="-21" y="-20" width="42" height="48" rx="21" ry="21"/>
<ellipse cx="-32" cy="32" rx="26" ry="13"/>
<ellipse cx="32" cy="32" rx="26" ry="13"/>
<circle cx="-33" cy="-2" r="11"/>
<circle cx="33" cy="-2" r="11"/>
</g>
<text font-family="Figtree, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1F1D1A" text-anchor="middle">
<tspan x="530" y="590">Sitting up</tspan>
</text>

<!-- Arrow 2 -->
<path d="M663,400 L715,400" stroke="#B8862B" stroke-width="8" fill="none" stroke-linecap="round"/>
<polygon points="715,386 737,400 715,414" fill="#B8862B"/>

<!-- Box 3: Crawling -->
<rect x="745" y="270" width="250" height="260" rx="16" ry="16" fill="#DDE5E0" stroke="#2F5D3A" stroke-width="3"/>
<g transform="translate(870,400)" fill="#2F5D3A" stroke="#2F5D3A">
<ellipse cx="0" cy="0" rx="46" ry="20"/>
<circle cx="-50" cy="-16" r="23"/>
<rect x="-34" y="8" width="15" height="48" rx="7.5" ry="7.5"/>
<rect x="20" y="8" width="17" height="52" rx="8.5" ry="8.5"/>
</g>
<text font-family="Figtree, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1F1D1A" text-anchor="middle">
<tspan x="870" y="590">Crawling</tspan>
</text>

<!-- Arrow 3 -->
<path d="M1003,400 L1055,400" stroke="#B8862B" stroke-width="8" fill="none" stroke-linecap="round"/>
<polygon points="1055,386 1077,400 1055,414" fill="#B8862B"/>

<!-- Box 4: Walking -->
<rect x="1085" y="270" width="250" height="260" rx="16" ry="16" fill="#DDE5E0" stroke="#2F5D3A" stroke-width="3"/>
<g transform="translate(1210,400)" fill="#2F5D3A" stroke="#2F5D3A">
<circle cx="0" cy="-48" r="23"/>
<rect x="-15" y="-27" width="30" height="48" rx="15" ry="15"/>
<rect x="-24" y="8" width="14" height="56" rx="7" ry="7"/>
<rect x="8" y="0" width="14" height="46" rx="7" ry="7"/>
<rect x="-31" y="-24" width="10" height="34" rx="5" ry="5"/>
<rect x="21" y="-19" width="10" height="30" rx="5" ry="5"/>
</g>
<text font-family="Figtree, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1F1D1A" text-anchor="middle">
<tspan x="1210" y="590">Walking</tspan>
</text>
</svg>
