<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800">
<style>text { font-family: Figtree, Arial, sans-serif; }</style>
<!-- Relative odds of a same sex orientation by number of older biological brothers -->
<rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>

<!-- vertical axis title, two lines -->
<text x="70" y="50" font-size="40" font-weight="600" fill="#1F1D1A">Relative odds of a same-sex orientation</text>
<text x="70" y="95" font-size="40" font-weight="600" fill="#1F1D1A">(0 older brothers = 1)</text>

<!-- bars -->
<rect x="317.5" y="440" width="150" height="140" fill="#2F5D3A"/>
<rect x="582.5" y="398" width="150" height="182" fill="#2F5D3A"/>
<rect x="847.5" y="328" width="150" height="252" fill="#2F5D3A"/>
<rect x="1112.5" y="244" width="150" height="336" fill="#2F5D3A"/>

<!-- reference line at relative odds = 1, the zero-older-brothers baseline -->
<line x1="260" y1="440" x2="1320" y2="440" stroke="#B8862B" stroke-width="3" stroke-dasharray="14,10"/>

<!-- y-axis tick marks -->
<line x1="246" y1="160" x2="260" y2="160" stroke="#DDE5E0" stroke-width="4"/>
<line x1="246" y1="300" x2="260" y2="300" stroke="#DDE5E0" stroke-width="4"/>
<line x1="246" y1="580" x2="260" y2="580" stroke="#DDE5E0" stroke-width="4"/>

<!-- y-axis tick labels -->
<text x="230" y="174" text-anchor="end" font-size="40" fill="#1F1D1A">3</text>
<text x="230" y="314" text-anchor="end" font-size="40" fill="#1F1D1A">2</text>
<text x="230" y="454" text-anchor="end" font-size="40" fill="#1F1D1A">1</text>
<text x="230" y="594" text-anchor="end" font-size="40" fill="#1F1D1A">0</text>

<!-- axes with filled-polygon arrowheads -->
<line x1="260" y1="580" x2="1339" y2="580" stroke="#1F1D1A" stroke-width="4"/>
<polygon points="1365,580 1339,568 1339,592" fill="#1F1D1A"/>
<line x1="260" y1="580" x2="260" y2="164" stroke="#1F1D1A" stroke-width="4"/>
<polygon points="260,140 248,164 272,164" fill="#1F1D1A"/>

<!-- x-axis category labels: number of older biological brothers -->
<text x="392.5" y="628" text-anchor="middle" font-size="40" fill="#1F1D1A">0</text>
<text x="657.5" y="628" text-anchor="middle" font-size="40" fill="#1F1D1A">1</text>
<text x="922.5" y="628" text-anchor="middle" font-size="40" fill="#1F1D1A">2</text>
<text x="1187.5" y="628" text-anchor="middle" font-size="40" fill="#1F1D1A">3</text>

<!-- x-axis title -->
<text x="790" y="690" text-anchor="middle" font-size="40" font-weight="600" fill="#1F1D1A">Number of older biological brothers</text>

<!-- value labels above bars -->
<text x="392.5" y="412" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">about 1.0</text>
<text x="657.5" y="370" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">about 1.3</text>
<text x="922.5" y="300" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">about 1.8</text>
<text x="1187.5" y="216" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">about 2.4</text>

<!-- footer note -->
<text x="700" y="743" text-anchor="middle" font-size="34" fill="#6B6459">Relative odds, not probability; computed from the 33 percent</text>
<text x="700" y="781" text-anchor="middle" font-size="34" fill="#6B6459">per-brother estimate, Cantor, Blanchard and Paterson (2002).</text>
</svg>
