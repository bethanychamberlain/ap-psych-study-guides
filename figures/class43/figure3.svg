<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" font-family="Figtree, 'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="1400" height="830" fill="#FFFFFF" />

  <text x="60" y="55" font-size="40" font-weight="700" fill="#1F1D1A">How the Milgram (1963) study was set up</text>

  <text x="60" y="115" font-size="36" font-weight="700" fill="#B8862B">STEP 1</text>
  <text x="200" y="115" font-size="36" font-weight="700" fill="#1F1D1A">The draw is rigged</text>

  <rect x="70" y="150" width="230" height="64" fill="#6B6459" />
  <rect x="72" y="152" width="226" height="60" fill="#FFFFFF" />
  <text x="185" y="188" font-size="34" font-weight="700" fill="#1F1D1A" text-anchor="middle">TEACHER</text>
  <rect x="95" y="185" width="230" height="64" fill="#6B6459" />
  <rect x="97" y="187" width="226" height="60" fill="#FFFFFF" />
  <text x="210" y="223" font-size="34" font-weight="700" fill="#1F1D1A" text-anchor="middle">TEACHER</text>

  <line x1="345" y1="217" x2="405" y2="217" stroke="#2F5D3A" stroke-width="4" />
  <polygon points="405,204 432,217 405,230" fill="#2F5D3A" />

  <text x="450" y="185" font-size="36" font-weight="700" fill="#1F1D1A">Both slips of paper read &#8220;Teacher.&#8221;</text>
  <text x="450" y="227" font-size="34" fill="#6B6459">The real participant is always Teacher;</text>
  <text x="450" y="267" font-size="34" fill="#6B6459">the actor is always Learner.</text>

  <line x1="60" y1="300" x2="1340" y2="300" stroke="#DDE5E0" stroke-width="3" />

  <text x="60" y="345" font-size="36" font-weight="700" fill="#B8862B">STEP 2</text>
  <text x="200" y="345" font-size="36" font-weight="700" fill="#1F1D1A">Two separate rooms</text>

  <rect x="60" y="375" width="800" height="435" fill="#2F5D3A" />
  <rect x="64" y="379" width="792" height="427" fill="#FFFFFF" />
  <text x="90" y="415" font-size="34" font-weight="700" fill="#6B6459" letter-spacing="1">ROOM 1</text>

  <circle cx="190" cy="446" r="26" fill="#2F5D3A" />
  <rect x="158" y="472" width="64" height="58" fill="#2F5D3A" />
  <text x="190" y="558" font-size="34" font-weight="700" fill="#1F1D1A" text-anchor="middle">EXPERIMENTER</text>

  <circle cx="190" cy="600" r="30" fill="#B8862B" />
  <rect x="158" y="630" width="64" height="64" fill="#B8862B" />
  <text x="190" y="720" font-size="36" font-weight="700" fill="#1F1D1A" text-anchor="middle">TEACHER</text>
  <text x="190" y="752" font-size="34" fill="#6B6459" text-anchor="middle">(the real</text>
  <text x="190" y="785" font-size="34" fill="#6B6459" text-anchor="middle">participant)</text>

  <rect x="360" y="405" width="480" height="360" fill="#2F5D3A" />
  <rect x="363" y="408" width="474" height="354" fill="#FFFFFF" />
  <text x="600" y="440" font-size="34" font-weight="700" fill="#1F1D1A" text-anchor="middle">SHOCK GENERATOR</text>

  <rect x="400" y="474" width="30" height="16" fill="#1F1D1A" />
  <rect x="400" y="497" width="30" height="16" fill="#1F1D1A" />
  <text x="445" y="494" font-size="34" font-weight="700" fill="#1F1D1A">SLIGHT SHOCK</text>

  <rect x="400" y="544" width="30" height="16" fill="#1F1D1A" />
  <rect x="400" y="567" width="30" height="16" fill="#1F1D1A" />
  <text x="445" y="564" font-size="34" font-weight="700" fill="#1F1D1A">STRONG SHOCK</text>

  <rect x="400" y="614" width="30" height="16" fill="#B8862B" />
  <rect x="400" y="637" width="30" height="16" fill="#B8862B" />
  <text x="445" y="634" font-size="34" font-weight="700" fill="#B8862B">DANGER:</text>
  <text x="445" y="672" font-size="34" font-weight="700" fill="#B8862B">SEVERE SHOCK</text>

  <rect x="400" y="715" width="30" height="16" fill="#B8862B" />
  <rect x="400" y="738" width="30" height="16" fill="#B8862B" />
  <text x="445" y="735" font-size="34" font-weight="700" fill="#B8862B">XXX</text>

  <rect x="900" y="375" width="440" height="435" fill="#6B6459" />
  <rect x="904" y="379" width="432" height="427" fill="#FFFFFF" />
  <text x="930" y="415" font-size="34" font-weight="700" fill="#6B6459" letter-spacing="1">ROOM 2</text>

  <text x="1120" y="460" font-size="34" fill="#6B6459" text-anchor="middle">never actually shocked</text>
  <circle cx="1120" cy="520" r="30" fill="#6B6459" />
  <rect x="1088" y="550" width="64" height="70" fill="#6B6459" />
  <text x="1120" y="662" font-size="36" font-weight="700" fill="#1F1D1A" text-anchor="middle">LEARNER</text>
  <text x="1120" y="700" font-size="34" fill="#6B6459" text-anchor="middle">(an actor, working</text>
  <text x="1120" y="735" font-size="34" fill="#6B6459" text-anchor="middle">with the researchers)</text>
</svg>
