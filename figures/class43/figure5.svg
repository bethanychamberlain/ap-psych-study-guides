<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>

<!-- Sherif camp study, four-step sequence: competition, hostility, a shared crisis, cooperation -->

<!-- Step 1: Two groups compete -->
<rect x="40" y="330" width="300" height="240" rx="18" fill="#FFFFFF" stroke="#2F5D3A" stroke-width="5"/>
<text x="190" y="430" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">Two groups</text>
<text x="190" y="482" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">compete</text>

<!-- Arrow 1 -->
<rect x="344" y="446" width="16" height="8" fill="#2F5D3A"/>
<polygon points="360,434 360,466 376,450" fill="#2F5D3A"/>

<!-- Step 2: Hostility grows -->
<rect x="380" y="330" width="300" height="240" rx="18" fill="#FFFFFF" stroke="#2F5D3A" stroke-width="5"/>
<text x="530" y="430" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">Hostility</text>
<text x="530" y="482" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">grows</text>

<!-- Arrow 2 -->
<rect x="684" y="446" width="16" height="8" fill="#2F5D3A"/>
<polygon points="700,434 700,466 716,450" fill="#2F5D3A"/>

<!-- Step 3: A crisis neither group can solve alone, the superordinate goal -->
<text x="870" y="216" text-anchor="middle" font-size="40" font-weight="700" fill="#B8862B" letter-spacing="1">superordinate</text>
<text x="870" y="262" text-anchor="middle" font-size="40" font-weight="700" fill="#B8862B" letter-spacing="1">goal</text>
<rect x="805" y="270" width="130" height="6" rx="3" fill="#B8862B"/>
<rect x="720" y="280" width="300" height="340" rx="18" fill="#B8862B" stroke="#DDE5E0" stroke-width="3"/>
<text x="870" y="352" text-anchor="middle" font-size="42" font-weight="700" fill="#FFFFFF">A crisis</text>
<text x="870" y="404" text-anchor="middle" font-size="42" font-weight="700" fill="#FFFFFF">neither</text>
<text x="870" y="456" text-anchor="middle" font-size="42" font-weight="700" fill="#FFFFFF">group can</text>
<text x="870" y="508" text-anchor="middle" font-size="42" font-weight="700" fill="#FFFFFF">solve</text>
<text x="870" y="560" text-anchor="middle" font-size="42" font-weight="700" fill="#FFFFFF">alone</text>

<!-- Arrow 3 -->
<rect x="1024" y="446" width="16" height="8" fill="#2F5D3A"/>
<polygon points="1040,434 1040,466 1056,450" fill="#2F5D3A"/>

<!-- Step 4: Working together, hostility drops -->
<rect x="1060" y="330" width="300" height="240" rx="18" fill="#FFFFFF" stroke="#2F5D3A" stroke-width="5"/>
<text x="1210" y="378" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">Working</text>
<text x="1210" y="430" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">together,</text>
<text x="1210" y="482" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">hostility</text>
<text x="1210" y="534" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">drops</text>

</svg>
