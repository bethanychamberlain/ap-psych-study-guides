<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>

<!-- The three-step chain: notice, interpret, take responsibility -->
<rect x="40" y="230" width="380" height="260" rx="20" fill="#DDE5E0"/>
<rect x="56" y="254" width="10" height="212" rx="4" fill="#2F5D3A"/>
<text x="238" y="375" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">Notice</text>

<rect x="510" y="230" width="380" height="260" rx="20" fill="#DDE5E0"/>
<rect x="526" y="254" width="10" height="212" rx="4" fill="#2F5D3A"/>
<text x="708" y="345" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">Interpret as</text>
<text x="708" y="401" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">emergency</text>

<rect x="980" y="230" width="380" height="260" rx="20" fill="#DDE5E0"/>
<rect x="996" y="254" width="10" height="212" rx="4" fill="#2F5D3A"/>
<text x="1178" y="345" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">Take</text>
<text x="1178" y="401" text-anchor="middle" font-size="42" font-weight="700" fill="#1F1D1A">responsibility</text>

<!-- Chain arrows, drawn as filled bars so they render everywhere (no stroked lines/markers) -->
<rect x="425" y="356" width="70" height="8" fill="#2F5D3A"/>
<polygon points="495,344 495,376 510,360" fill="#2F5D3A"/>

<rect x="895" y="356" width="70" height="8" fill="#2F5D3A"/>
<polygon points="965,344 965,376 980,360" fill="#2F5D3A"/>

<!-- Onlooker-with-block badge, repeated above each of the three steps: others present can interrupt any of them, not only the last -->
<g transform="translate(158,80)">
  <circle cx="40" cy="96" r="14" fill="#6B6459"/>
  <path d="M 20,130 Q 20,94 40,94 Q 60,94 60,130 Z" fill="#6B6459"/>
  <circle cx="80" cy="96" r="14" fill="#6B6459"/>
  <path d="M 60,130 Q 60,94 80,94 Q 100,94 100,130 Z" fill="#6B6459"/>
  <circle cx="120" cy="96" r="14" fill="#6B6459"/>
  <path d="M 100,130 Q 100,94 120,94 Q 140,94 140,130 Z" fill="#6B6459"/>
  <path fill-rule="evenodd" fill="#B8862B" opacity="0.5" d="M 10,100 A 70,70 0 1 0 150,100 A 70,70 0 1 0 10,100 Z M 24,100 A 56,56 0 1 0 136,100 A 56,56 0 1 0 24,100 Z"/>
  <polygon points="128,158 138,148 32,42 22,52" fill="#B8862B" opacity="0.5"/>
</g>

<g transform="translate(628,80)">
  <circle cx="40" cy="96" r="14" fill="#6B6459"/>
  <path d="M 20,130 Q 20,94 40,94 Q 60,94 60,130 Z" fill="#6B6459"/>
  <circle cx="80" cy="96" r="14" fill="#6B6459"/>
  <path d="M 60,130 Q 60,94 80,94 Q 100,94 100,130 Z" fill="#6B6459"/>
  <circle cx="120" cy="96" r="14" fill="#6B6459"/>
  <path d="M 100,130 Q 100,94 120,94 Q 140,94 140,130 Z" fill="#6B6459"/>
  <path fill-rule="evenodd" fill="#B8862B" opacity="0.5" d="M 10,100 A 70,70 0 1 0 150,100 A 70,70 0 1 0 10,100 Z M 24,100 A 56,56 0 1 0 136,100 A 56,56 0 1 0 24,100 Z"/>
  <polygon points="128,158 138,148 32,42 22,52" fill="#B8862B" opacity="0.5"/>
</g>

<g transform="translate(1098,80)">
  <circle cx="40" cy="96" r="14" fill="#6B6459"/>
  <path d="M 20,130 Q 20,94 40,94 Q 60,94 60,130 Z" fill="#6B6459"/>
  <circle cx="80" cy="96" r="14" fill="#6B6459"/>
  <path d="M 60,130 Q 60,94 80,94 Q 100,94 100,130 Z" fill="#6B6459"/>
  <circle cx="120" cy="96" r="14" fill="#6B6459"/>
  <path d="M 100,130 Q 100,94 120,94 Q 140,94 140,130 Z" fill="#6B6459"/>
  <path fill-rule="evenodd" fill="#B8862B" opacity="0.5" d="M 10,100 A 70,70 0 1 0 150,100 A 70,70 0 1 0 10,100 Z M 24,100 A 56,56 0 1 0 136,100 A 56,56 0 1 0 24,100 Z"/>
  <polygon points="128,158 138,148 32,42 22,52" fill="#B8862B" opacity="0.5"/>
</g>

<!-- Legend, names the badge -->
<g transform="translate(60,600) scale(0.55)">
  <circle cx="40" cy="96" r="14" fill="#6B6459"/>
  <path d="M 20,130 Q 20,94 40,94 Q 60,94 60,130 Z" fill="#6B6459"/>
  <circle cx="80" cy="96" r="14" fill="#6B6459"/>
  <path d="M 60,130 Q 60,94 80,94 Q 100,94 100,130 Z" fill="#6B6459"/>
  <circle cx="120" cy="96" r="14" fill="#6B6459"/>
  <path d="M 100,130 Q 100,94 120,94 Q 140,94 140,130 Z" fill="#6B6459"/>
  <path fill-rule="evenodd" fill="#B8862B" opacity="0.5" d="M 10,100 A 70,70 0 1 0 150,100 A 70,70 0 1 0 10,100 Z M 24,100 A 56,56 0 1 0 136,100 A 56,56 0 1 0 24,100 Z"/>
  <polygon points="128,158 138,148 32,42 22,52" fill="#B8862B" opacity="0.5"/>
</g>
<text x="150" y="668" font-size="36" font-weight="700" fill="#1F1D1A">Others present</text>
<text x="150" y="708" font-size="34" fill="#6B6459">can interrupt any step in the chain</text>

</svg>
