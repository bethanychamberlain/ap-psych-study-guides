<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>
<text x="140" y="70" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A" text-anchor="start">Percent who went to the maximum voltage</text>
<!-- shared axis: 0% and 100% reference lines -->
<line x1="120" y1="170" x2="1360" y2="170" stroke="#DDE5E0" stroke-width="2"/>
<text x="110" y="178" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="28" fill="#6B6459" text-anchor="end">100%</text>
<line x1="120" y1="640" x2="1360" y2="640" stroke="#6B6459" stroke-width="2"/>
<text x="110" y="648" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="28" fill="#6B6459" text-anchor="end">0%</text>
<!-- vertical divider marking two separate runs, with a clear gap on either side -->
<line x1="700" y1="145" x2="700" y2="665" stroke="#6B6459" stroke-width="3"/>
<!-- left panel: original study, more than 60 percent -->
<rect x="290" y="349" width="220" height="291" fill="#2F5D3A"/>
<text x="400" y="324" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#1F1D1A" text-anchor="middle">More than 60%</text>
<text x="400" y="695" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A" text-anchor="middle">Original study</text>
<!-- right panel: follow-up with 40 new participants, 65 percent -->
<rect x="890" y="334" width="220" height="306" fill="#2F5D3A"/>
<text x="1000" y="309" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#1F1D1A" text-anchor="middle">65%</text>
<text x="1000" y="695" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A" text-anchor="middle">Follow-up</text>
<text x="1000" y="733" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="30" fill="#6B6459" text-anchor="middle">(40 new participants)</text>
</svg>
