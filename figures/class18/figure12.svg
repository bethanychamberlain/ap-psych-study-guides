<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800">
<rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>

<!-- column headers -->
<text x="370" y="55" text-anchor="middle" font-family="Figtree, sans-serif" font-size="36" font-weight="700" fill="#2F5D3A">Motor cortex</text>
<text x="1030" y="55" text-anchor="middle" font-family="Figtree, sans-serif" font-size="36" font-weight="700" fill="#B8862B">Somatosensory cortex</text>

<!-- central sulcus divider -->
<line x1="700" y1="100" x2="700" y2="680" stroke="#6B6459" stroke-width="2" stroke-dasharray="6,6"/>

<!-- row: Foot -->
<rect x="520" y="110" width="90" height="60" rx="4" fill="#2F5D3A" fill-opacity="0.47"/>
<rect x="790" y="110" width="90" height="60" rx="4" fill="#B8862B" fill-opacity="0.47"/>
<text x="700" y="148" text-anchor="middle" font-family="Figtree, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A">Foot</text>

<!-- row: Leg -->
<rect x="500" y="182" width="110" height="60" rx="4" fill="#2F5D3A" fill-opacity="0.50"/>
<rect x="790" y="182" width="110" height="60" rx="4" fill="#B8862B" fill-opacity="0.50"/>
<text x="700" y="220" text-anchor="middle" font-family="Figtree, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A">Leg</text>

<!-- row: Trunk -->
<rect x="480" y="254" width="130" height="60" rx="4" fill="#2F5D3A" fill-opacity="0.53"/>
<rect x="790" y="254" width="130" height="60" rx="4" fill="#B8862B" fill-opacity="0.53"/>
<text x="700" y="292" text-anchor="middle" font-family="Figtree, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A">Trunk</text>

<!-- row: Arm -->
<rect x="440" y="326" width="170" height="60" rx="4" fill="#2F5D3A" fill-opacity="0.58"/>
<rect x="790" y="326" width="170" height="60" rx="4" fill="#B8862B" fill-opacity="0.58"/>
<text x="700" y="364" text-anchor="middle" font-family="Figtree, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A">Arm</text>

<!-- row: Hand (largest) -->
<rect x="130" y="398" width="480" height="60" rx="4" fill="#2F5D3A" fill-opacity="1.0"/>
<rect x="790" y="398" width="480" height="60" rx="4" fill="#B8862B" fill-opacity="1.0"/>
<text x="700" y="436" text-anchor="middle" font-family="Figtree, sans-serif" font-size="34" font-weight="700" fill="#1F1D1A">Hand</text>

<!-- row: Face (large) -->
<rect x="180" y="470" width="430" height="60" rx="4" fill="#2F5D3A" fill-opacity="0.93"/>
<rect x="790" y="470" width="430" height="60" rx="4" fill="#B8862B" fill-opacity="0.93"/>
<text x="700" y="508" text-anchor="middle" font-family="Figtree, sans-serif" font-size="34" font-weight="700" fill="#1F1D1A">Face</text>

<!-- row: Lips (large) -->
<rect x="210" y="542" width="400" height="60" rx="4" fill="#2F5D3A" fill-opacity="0.89"/>
<rect x="790" y="542" width="400" height="60" rx="4" fill="#B8862B" fill-opacity="0.89"/>
<text x="700" y="580" text-anchor="middle" font-family="Figtree, sans-serif" font-size="34" font-weight="700" fill="#1F1D1A">Lips</text>

<!-- row: Tongue -->
<rect x="390" y="614" width="220" height="60" rx="4" fill="#2F5D3A" fill-opacity="0.65"/>
<rect x="790" y="614" width="220" height="60" rx="4" fill="#B8862B" fill-opacity="0.65"/>
<text x="700" y="652" text-anchor="middle" font-family="Figtree, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A">Tongue</text>

<!-- caption -->
<text x="700" y="730" text-anchor="middle" font-family="Figtree, sans-serif" font-size="34" fill="#6B6459">Bar length shows relative share of cortex, not exact amounts.</text>

</svg>
