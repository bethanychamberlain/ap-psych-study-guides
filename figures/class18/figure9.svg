<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="sans-serif">
  <rect width="1400" height="800" fill="#FFFFFF"/>

  <line x1="700" y1="40" x2="700" y2="720" stroke="#DDE5E0" stroke-width="4"/>

  <text x="350" y="100" font-size="58" font-weight="700" fill="#1F1D1A" text-anchor="middle">BEFORE</text>
  <text x="1050" y="100" font-size="58" font-weight="700" fill="#1F1D1A" text-anchor="middle">AFTER</text>

  <!-- LEFT: Before -->
  <g transform="translate(70,180) scale(1.1)">
    <path d="M 40,180 C 10,120 40,40 130,20 C 190,5 260,0 320,20 C 400,45 460,90 490,150 C 510,190 505,230 480,260 C 495,275 500,300 480,315 C 460,335 430,325 415,335 C 400,350 370,350 355,335 C 340,355 305,360 280,345 C 260,370 220,365 205,345 C 175,355 150,340 145,315 C 110,320 75,300 60,270 C 30,250 20,215 40,180 Z" fill="#1F1D1A"/>
    <g transform="translate(255,185) scale(0.965) translate(-255,-185)">
      <path d="M 40,180 C 10,120 40,40 130,20 C 190,5 260,0 320,20 C 400,45 460,90 490,150 C 510,190 505,230 480,260 C 495,275 500,300 480,315 C 460,335 430,325 415,335 C 400,350 370,350 355,335 C 340,355 305,360 280,345 C 260,370 220,365 205,345 C 175,355 150,340 145,315 C 110,320 75,300 60,270 C 30,250 20,215 40,180 Z" fill="#DDE5E0"/>
    </g>
    <line x1="95" y1="175" x2="235" y2="255" stroke="#6B6459" stroke-width="3"/>
    <ellipse cx="340" cy="90" rx="75" ry="55" fill="#2F5D3A"/>
  </g>

  <line x1="444" y1="339" x2="380" y2="560" stroke="#1F1D1A" stroke-width="3"/>
  <circle cx="444" cy="339" r="8" fill="#1F1D1A"/>
  <text x="380" y="610" font-size="42" font-weight="700" fill="#2F5D3A" text-anchor="middle">Hand Movement</text>

  <!-- RIGHT: After -->
  <g transform="translate(770,180) scale(1.1)">
    <path d="M 40,180 C 10,120 40,40 130,20 C 190,5 260,0 320,20 C 400,45 460,90 490,150 C 510,190 505,230 480,260 C 495,275 500,300 480,315 C 460,335 430,325 415,335 C 400,350 370,350 355,335 C 340,355 305,360 280,345 C 260,370 220,365 205,345 C 175,355 150,340 145,315 C 110,320 75,300 60,270 C 30,250 20,215 40,180 Z" fill="#1F1D1A"/>
    <g transform="translate(255,185) scale(0.965) translate(-255,-185)">
      <path d="M 40,180 C 10,120 40,40 130,20 C 190,5 260,0 320,20 C 400,45 460,90 490,150 C 510,190 505,230 480,260 C 495,275 500,300 480,315 C 460,335 430,325 415,335 C 400,350 370,350 355,335 C 340,355 305,360 280,345 C 260,370 220,365 205,345 C 175,355 150,340 145,315 C 110,320 75,300 60,270 C 30,250 20,215 40,180 Z" fill="#DDE5E0"/>
    </g>
    <line x1="95" y1="175" x2="235" y2="255" stroke="#6B6459" stroke-width="3"/>

    <!-- damaged region: gray fill plus an X to mark the injury -->
    <ellipse cx="340" cy="90" rx="75" ry="55" fill="#6B6459"/>
    <line x1="404.95" y1="117.5" x2="275.05" y2="62.5" stroke="#DDE5E0" stroke-width="5"/>
    <line x1="275.05" y1="117.5" x2="404.95" y2="62.5" stroke="#DDE5E0" stroke-width="5"/>

    <!-- reassigned region: ochre ring (double-ellipse) around a forest fill -->
    <ellipse cx="180" cy="128" rx="68" ry="56" fill="#B8862B"/>
    <ellipse cx="180" cy="128" rx="60" ry="48" fill="#2F5D3A"/>
  </g>

  <!-- arrow showing the function moving from the damaged site to the neighboring site -->
  <line x1="1144" y1="202" x2="968" y2="243" stroke="#B8862B" stroke-width="6"/>
  <polygon points="950.5,247.1 965.7,233.3 970.3,252.7" fill="#B8862B"/>

  <line x1="1144" y1="339" x2="1230" y2="460" stroke="#6B6459" stroke-width="3"/>
  <circle cx="1144" cy="339" r="8" fill="#6B6459"/>
  <text x="1230" y="510" font-size="40" font-weight="700" fill="#6B6459" text-anchor="middle">Damaged</text>

  <line x1="968" y1="382" x2="900" y2="560" stroke="#2F5D3A" stroke-width="3"/>
  <circle cx="968" cy="382" r="8" fill="#2F5D3A"/>
  <text x="900" y="610" font-size="42" font-weight="700" fill="#2F5D3A" text-anchor="middle">Reassigned</text>
</svg>
