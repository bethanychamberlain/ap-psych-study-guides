<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>

<!-- critical period band: faint shaded rect under the flat early portion of the curve -->
<rect x="200" y="100" width="360" height="550" fill="#B8862B" fill-opacity="0.13"/>
<text x="380" y="590" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#6B6459" text-anchor="middle">Critical period</text>

<!-- axes -->
<path d="M 200,650 L 1320,650 L 1298,632 M 1320,650 L 1298,668" fill="none" stroke="#2F5D3A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 200,650 L 200,100 L 182,122 M 200,100 L 218,122" fill="none" stroke="#2F5D3A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- stage ticks on x axis, no numeric values -->
<line x1="220" y1="650" x2="220" y2="664" stroke="#6B6459" stroke-width="3"/>
<line x1="750" y1="650" x2="750" y2="664" stroke="#6B6459" stroke-width="3"/>
<line x1="1290" y1="650" x2="1290" y2="664" stroke="#6B6459" stroke-width="3"/>

<!-- second-language grammar curve: high and flat through early childhood, bending down across adolescence, settling low in adulthood. No data points, no numbers. -->
<path d="M220,160 C380,155 470,168 560,188 C700,244 830,410 960,514 C1080,568 1190,592 1290,600" fill="none" stroke="#2F5D3A" stroke-width="8" stroke-linecap="round"/>

<!-- stage labels beneath the ticks -->
<text x="220" y="702" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A" text-anchor="middle">Early childhood</text>
<text x="750" y="702" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A" text-anchor="middle">Adolescence</text>
<text x="1290" y="702" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#1F1D1A" text-anchor="middle">Adulthood</text>

<!-- axis titles -->
<text x="760" y="748" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1F1D1A" text-anchor="middle">Age at first full immersion</text>
<text x="0" y="0" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1F1D1A" text-anchor="middle" transform="translate(96,375) rotate(-90)">Grammar test score</text>
</svg>
