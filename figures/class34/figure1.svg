<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>

<!-- floor -->
<rect x="80" y="648" width="1240" height="6" fill="#DDE5E0"/>

<!-- adult figure, far left -->
<g stroke="#2F5D3A" stroke-width="10" stroke-linecap="round" fill="none">
  <line x1="190" y1="375" x2="190" y2="560"/>
  <line x1="190" y1="410" x2="130" y2="500"/>
  <line x1="190" y1="410" x2="250" y2="480"/>
  <line x1="190" y1="560" x2="145" y2="648"/>
  <line x1="190" y1="560" x2="235" y2="648"/>
</g>
<circle cx="190" cy="330" r="45" stroke="#2F5D3A" stroke-width="10" fill="#FFFFFF"/>

<!-- baby figure, seated, left-center -->
<g stroke="#2F5D3A" stroke-width="10" stroke-linecap="round" fill="none">
  <line x1="560" y1="520" x2="560" y2="605"/>
  <line x1="525" y1="545" x2="468" y2="600"/>
  <line x1="560" y1="605" x2="498" y2="648"/>
  <line x1="560" y1="605" x2="640" y2="648"/>
</g>
<circle cx="560" cy="460" r="60" stroke="#2F5D3A" stroke-width="10" fill="#FFFFFF"/>

<!-- pointing arm: solid forest line from baby toward the cup -->
<line x1="596" y1="545" x2="985" y2="480" stroke="#2F5D3A" stroke-width="12" stroke-linecap="round"/>
<polygon points="990,478 961,499 956,466" fill="#2F5D3A"/>

<!-- table -->
<g fill="#6B6459">
  <rect x="950" y="520" width="300" height="22" rx="4"/>
  <rect x="966" y="542" width="16" height="106"/>
  <rect x="1228" y="542" width="16" height="106"/>
</g>

<!-- cup on the table -->
<polygon points="1032,458 1112,458 1101,520 1043,520" fill="#6B6459"/>
<path d="M 1112,468 Q 1138,477 1138,494 Q 1138,511 1104,516" fill="none" stroke="#6B6459" stroke-width="8" stroke-linecap="round"/>

<!-- gaze line: dashed ochre, baby's head back to the adult's head -->
<path d="M 513,414 Q 380,254 232,297" fill="none" stroke="#B8862B" stroke-width="8" stroke-dasharray="18 14" stroke-linecap="round"/>
<polygon points="225,300 252,281 258,313" fill="#B8862B"/>

<!-- labels -->
<text x="815" y="424" text-anchor="middle" font-size="44" font-weight="700" fill="#2F5D3A">points at the cup</text>
<text x="470" y="196" text-anchor="middle" font-size="44" font-weight="700" fill="#B8862B">looks back at you</text>

<!-- synthesis line -->
<text x="700" y="704" text-anchor="middle" font-size="40" font-weight="600" fill="#1F1D1A">Pointing plus the look back:</text>
<text x="700" y="756" text-anchor="middle" font-size="40" font-weight="700" fill="#1F1D1A">communicating, not just reaching.</text>
</svg>
