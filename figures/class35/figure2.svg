<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="Figtree, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>

  <defs>
    <pattern id="clothTexture" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <line x1="0" y1="22" x2="22" y2="0" stroke="#B8862B" stroke-width="2" opacity="0.55"/>
    </pattern>
    <clipPath id="clothClip">
      <rect x="930" y="245" width="240" height="280" rx="90" ry="90"/>
      <circle cx="1050" cy="185" r="80"/>
      <path d="M 930 300 C 860 320 860 400 930 430 Z"/>
      <path d="M 1170 300 C 1240 320 1240 400 1170 430 Z"/>
    </clipPath>
  </defs>

  <!-- center divider, purely a soft separation cue -->
  <line x1="700" y1="70" x2="700" y2="770" stroke="#DDE5E0" stroke-width="3"/>

  <!-- ============ LEFT: wire mother ============ -->
  <g>
    <!-- head, drawn as a wire globe: outline plus a few mesh lines -->
    <circle cx="350" cy="170" r="70" fill="#FFFFFF" stroke="#2F5D3A" stroke-width="5"/>
    <line x1="280" y1="170" x2="420" y2="170" stroke="#2F5D3A" stroke-width="2"/>
    <line x1="350" y1="100" x2="350" y2="240" stroke="#2F5D3A" stroke-width="2"/>
    <line x1="303" y1="122" x2="303" y2="218" stroke="#2F5D3A" stroke-width="2"/>
    <line x1="397" y1="122" x2="397" y2="218" stroke="#2F5D3A" stroke-width="2"/>
    <line x1="292" y1="140" x2="408" y2="140" stroke="#2F5D3A" stroke-width="2"/>
    <line x1="292" y1="200" x2="408" y2="200" stroke="#2F5D3A" stroke-width="2"/>

    <!-- torso, a wire-mesh cylinder: outline plus a grid of thin lines -->
    <rect x="250" y="240" width="200" height="230" rx="40" ry="40" fill="#FFFFFF" stroke="#2F5D3A" stroke-width="5"/>
    <line x1="300" y1="240" x2="300" y2="470" stroke="#2F5D3A" stroke-width="2"/>
    <line x1="350" y1="240" x2="350" y2="470" stroke="#2F5D3A" stroke-width="2"/>
    <line x1="400" y1="240" x2="400" y2="470" stroke="#2F5D3A" stroke-width="2"/>
    <line x1="250" y1="290" x2="450" y2="290" stroke="#2F5D3A" stroke-width="2"/>
    <line x1="250" y1="340" x2="450" y2="340" stroke="#2F5D3A" stroke-width="2"/>
    <line x1="250" y1="390" x2="450" y2="390" stroke="#2F5D3A" stroke-width="2"/>
    <line x1="250" y1="440" x2="450" y2="440" stroke="#2F5D3A" stroke-width="2"/>

    <!-- thin wire arms and legs, ending in small joints -->
    <line x1="250" y1="270" x2="180" y2="340" stroke="#2F5D3A" stroke-width="5"/>
    <circle cx="180" cy="340" r="10" fill="#2F5D3A"/>
    <line x1="450" y1="270" x2="520" y2="340" stroke="#2F5D3A" stroke-width="5"/>
    <circle cx="520" cy="340" r="10" fill="#2F5D3A"/>
    <line x1="300" y1="470" x2="290" y2="545" stroke="#2F5D3A" stroke-width="5"/>
    <circle cx="290" cy="545" r="10" fill="#2F5D3A"/>
    <line x1="400" y1="470" x2="410" y2="545" stroke="#2F5D3A" stroke-width="5"/>
    <circle cx="410" cy="545" r="10" fill="#2F5D3A"/>

    <!-- the bottle, mounted at the front -->
    <rect x="460" y="380" width="50" height="90" rx="10" fill="#FFFFFF" stroke="#2F5D3A" stroke-width="4"/>
    <rect x="475" y="352" width="20" height="32" fill="#FFFFFF" stroke="#2F5D3A" stroke-width="4"/>
    <rect x="471" y="340" width="28" height="14" rx="4" fill="#2F5D3A" stroke="#2F5D3A" stroke-width="4"/>
  </g>

  <!-- ============ RIGHT: cloth mother ============ -->
  <g>
    <circle cx="1050" cy="185" r="80" fill="#B8862B" fill-opacity="0.16" stroke="#B8862B" stroke-width="5"/>
    <rect x="930" y="245" width="240" height="280" rx="90" ry="90" fill="#B8862B" fill-opacity="0.16" stroke="#B8862B" stroke-width="5"/>
    <path d="M 930 300 C 860 320 860 400 930 430 Z" fill="#B8862B" fill-opacity="0.16" stroke="#B8862B" stroke-width="5"/>
    <path d="M 1170 300 C 1240 320 1240 400 1170 430 Z" fill="#B8862B" fill-opacity="0.16" stroke="#B8862B" stroke-width="5"/>
    <!-- terrycloth texture, clipped to the figure's own silhouette -->
    <rect x="850" y="100" width="420" height="450" fill="url(#clothTexture)" clip-path="url(#clothClip)"/>
  </g>

  <!-- infant silhouette, clinging to the cloth mother's chest -->
  <g>
    <path d="M 1005 452 Q 1038 462 1028 492" fill="none" stroke="#1F1D1A" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="990" cy="410" rx="36" ry="46" fill="#1F1D1A"/>
    <circle cx="978" cy="350" r="28" fill="#1F1D1A"/>
    <path d="M 962 420 Q 925 415 935 380" fill="none" stroke="#1F1D1A" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="972" cy="452" rx="12" ry="8" fill="#1F1D1A"/>
    <ellipse cx="1006" cy="452" rx="12" ry="8" fill="#1F1D1A"/>
  </g>

  <!-- dashed path: the infant's visits to the wire mother, and back -->
  <path d="M 900 480 L 900 600 L 470 600 L 470 440" fill="none" stroke="#6B6459" stroke-width="4" stroke-dasharray="12,10"/>
  <polygon points="470,426 458,448 482,448" fill="#1F1D1A"/>

  <!-- labels -->
  <text x="685" y="645" font-size="38" fill="#6B6459" text-anchor="middle">visits to feed, then returns</text>

  <text x="350" y="705" font-size="44" font-weight="700" fill="#1F1D1A" text-anchor="middle">wire mother</text>
  <text x="350" y="758" font-size="40" fill="#6B6459" text-anchor="middle">gives food</text>

  <text x="1050" y="705" font-size="44" font-weight="700" fill="#1F1D1A" text-anchor="middle">cloth mother</text>
  <text x="1050" y="758" font-size="40" fill="#6B6459" text-anchor="middle">gives contact, no food</text>
</svg>
