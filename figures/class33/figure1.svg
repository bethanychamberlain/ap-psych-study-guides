<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="Figtree, Arial, sans-serif">
<rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>

<!-- panel headers -->
<text x="340" y="100" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="3" fill="#1F1D1A">BEFORE</text>
<text x="1020" y="100" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="3" fill="#1F1D1A">AFTER</text>

<!-- arrow marking the passage of a moment, between the two frames -->
<line x1="605" y1="130" x2="735" y2="130" stroke="#1F1D1A" stroke-width="6" stroke-linecap="round"/>
<polygon points="752,130 726,118 726,142" fill="#1F1D1A"/>

<!-- panel divider -->
<line x1="690" y1="160" x2="690" y2="650" stroke="#DDE5E0" stroke-width="4"/>

<!-- ground lines -->
<line x1="130" y1="605" x2="550" y2="605" stroke="#DDE5E0" stroke-width="4"/>
<line x1="810" y1="605" x2="1230" y2="605" stroke="#DDE5E0" stroke-width="4"/>

<!-- FRAME 1: infant sitting, toy visible in the open, gaze aimed at the toy -->
<ellipse cx="230" cy="520" rx="95" ry="90" fill="#2F5D3A"/>
<circle cx="185" cy="600" r="22" fill="#2F5D3A"/>
<circle cx="275" cy="600" r="22" fill="#2F5D3A"/>
<circle cx="230" cy="390" r="62" fill="#2F5D3A"/>
<circle cx="248" cy="378" r="11" fill="#FFFFFF"/>
<circle cx="255" cy="378" r="5" fill="#1F1D1A"/>
<circle cx="272" cy="382" r="11" fill="#FFFFFF"/>
<circle cx="279" cy="382" r="5" fill="#1F1D1A"/>

<rect x="430" y="470" width="110" height="135" rx="14" ry="14" fill="#B8862B"/>
<circle cx="485" cy="445" r="28" fill="#B8862B"/>

<!-- gaze line: eye to toy -->
<circle cx="280" cy="380" r="6" fill="#1F1D1A"/>
<line x1="280" y1="380" x2="431" y2="450" stroke="#1F1D1A" stroke-width="5" stroke-dasharray="14 10"/>
<polygon points="455,460 426,460 436,438" fill="#1F1D1A"/>

<!-- FRAME 2: same infant, toy now covered by a cloth, gaze aimed elsewhere -->
<ellipse cx="910" cy="520" rx="95" ry="90" fill="#2F5D3A"/>
<circle cx="865" cy="600" r="22" fill="#2F5D3A"/>
<circle cx="955" cy="600" r="22" fill="#2F5D3A"/>
<circle cx="910" cy="390" r="62" fill="#2F5D3A"/>
<circle cx="892" cy="378" r="11" fill="#FFFFFF"/>
<circle cx="892" cy="371" r="5" fill="#1F1D1A"/>
<circle cx="928" cy="378" r="11" fill="#FFFFFF"/>
<circle cx="928" cy="371" r="5" fill="#1F1D1A"/>

<path d="M1085,605 C1085,500 1125,430 1165,430 C1205,430 1245,500 1245,605 Q1225,622 1205,605 Q1185,622 1165,605 Q1145,622 1125,605 Q1105,622 1085,605 Z" fill="#6B6459"/>

<!-- gaze line: eye up and away, not toward the covered cloth -->
<circle cx="910" cy="372" r="6" fill="#1F1D1A"/>
<line x1="910" y1="365" x2="843" y2="234" stroke="#1F1D1A" stroke-width="5" stroke-dasharray="14 10"/>
<polygon points="830,210 853,228 831,239" fill="#1F1D1A"/>

<!-- captions -->
<text x="340" y="700" text-anchor="middle" font-size="36" font-weight="700" fill="#1F1D1A">Toy visible</text>
<text x="1020" y="700" text-anchor="middle" font-size="36" font-weight="700" fill="#1F1D1A">Toy covered</text>
</svg>
