<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" font-family="Figtree, Arial, sans-serif">
  <rect x="0" y="0" width="1400" height="800" fill="#FFFFFF" />

  <!-- ================= ROW 1: Foot-in-the-door ================= -->
  <text x="150" y="55" font-size="44" font-weight="800" fill="#2F5D3A">Foot-in-the-door</text>

  <!-- ask 1: small ask -->
  <rect x="150" y="83" width="340" height="110" rx="14" fill="#FFFFFF" stroke="#2F5D3A" stroke-width="5" />
  <text x="320" y="138" font-size="40" font-weight="700" fill="#1F1D1A" text-anchor="middle" dominant-baseline="central">small ask</text>

  <!-- connector: ask1 -> yes -->
  <line x1="494" y1="138" x2="526" y2="138" stroke="#2F5D3A" stroke-width="6" stroke-linecap="round" />
  <polygon points="548,138 526,148 526,128" fill="#2F5D3A" />

  <!-- outcome: yes -->
  <circle cx="610" cy="138" r="55" fill="#2F5D3A" />
  <text x="610" y="138" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">yes</text>

  <!-- connector: yes -> ask2 -->
  <line x1="674" y1="138" x2="706" y2="138" stroke="#2F5D3A" stroke-width="6" stroke-linecap="round" />
  <polygon points="728,138 706,148 706,128" fill="#2F5D3A" />

  <!-- ask 2: large ask -->
  <rect x="730" y="83" width="340" height="110" rx="14" fill="#FFFFFF" stroke="#2F5D3A" stroke-width="5" />
  <text x="900" y="138" font-size="40" font-weight="700" fill="#1F1D1A" text-anchor="middle" dominant-baseline="central">large ask</text>

  <!-- connector: ask2 -> yes -->
  <line x1="1074" y1="138" x2="1106" y2="138" stroke="#2F5D3A" stroke-width="6" stroke-linecap="round" />
  <polygon points="1128,138 1106,148 1106,128" fill="#2F5D3A" />

  <!-- outcome: yes -->
  <circle cx="1190" cy="138" r="55" fill="#2F5D3A" />
  <text x="1190" y="138" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">yes</text>

  <!-- big rising ochre arrow: the asks get bigger -->
  <line x1="150" y1="360" x2="1206.2" y2="254.4" stroke="#B8862B" stroke-width="10" stroke-linecap="round" />
  <polygon points="1250,250 1208.1,273.3 1204.3,235.5" fill="#B8862B" />
  <text x="500" y="255" font-size="40" font-weight="600" fill="#1F1D1A" text-anchor="middle" dominant-baseline="central">the asks get bigger</text>

  <!-- divider -->
  <line x1="100" y1="400" x2="1300" y2="400" stroke="#DDE5E0" stroke-width="2" />

  <!-- ================= ROW 2: Door-in-the-face ================= -->
  <text x="150" y="450" font-size="44" font-weight="800" fill="#2F5D3A">Door-in-the-face</text>

  <!-- ask 1: large ask -->
  <rect x="150" y="478" width="340" height="110" rx="14" fill="#FFFFFF" stroke="#2F5D3A" stroke-width="5" />
  <text x="320" y="533" font-size="40" font-weight="700" fill="#1F1D1A" text-anchor="middle" dominant-baseline="central">large ask</text>

  <!-- connector: ask1 -> no -->
  <line x1="494" y1="533" x2="526" y2="533" stroke="#2F5D3A" stroke-width="6" stroke-linecap="round" />
  <polygon points="548,533 526,543 526,523" fill="#2F5D3A" />

  <!-- outcome: no -->
  <circle cx="610" cy="533" r="55" fill="#2F5D3A" />
  <text x="610" y="533" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">no</text>

  <!-- connector: no -> ask2 -->
  <line x1="674" y1="533" x2="706" y2="533" stroke="#2F5D3A" stroke-width="6" stroke-linecap="round" />
  <polygon points="728,533 706,543 706,523" fill="#2F5D3A" />

  <!-- ask 2: moderate ask -->
  <rect x="730" y="478" width="340" height="110" rx="14" fill="#FFFFFF" stroke="#2F5D3A" stroke-width="5" />
  <text x="900" y="533" font-size="40" font-weight="700" fill="#1F1D1A" text-anchor="middle" dominant-baseline="central">moderate ask</text>

  <!-- connector: ask2 -> yes -->
  <line x1="1074" y1="533" x2="1106" y2="533" stroke="#2F5D3A" stroke-width="6" stroke-linecap="round" />
  <polygon points="1128,533 1106,543 1106,523" fill="#2F5D3A" />

  <!-- outcome: yes -->
  <circle cx="1190" cy="533" r="55" fill="#2F5D3A" />
  <text x="1190" y="533" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">yes</text>

  <!-- big falling ochre arrow: the asks get smaller -->
  <line x1="150" y1="645" x2="1206.2" y2="750.6" stroke="#B8862B" stroke-width="10" stroke-linecap="round" />
  <polygon points="1250,755 1204.3,769.5 1208.1,731.7" fill="#B8862B" />
  <text x="500" y="750" font-size="40" font-weight="600" fill="#1F1D1A" text-anchor="middle" dominant-baseline="central">the asks get smaller</text>
</svg>
