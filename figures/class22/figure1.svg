<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>
<ellipse cx="170" cy="450" rx="270" ry="240" fill="#B8862B" opacity="0.08"/>
<text x="700" y="90" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="2" fill="#6B6459" text-anchor="middle">A CATEGORY HAS A CENTER AND AN EDGE</text>

<!-- Bird 1: robin-like, prototype -->
<g transform="translate(170,560)">
<polygon points="-50,-58 -82,-74 -50,-40" fill="#2F5D3A"/>
<ellipse cx="0" cy="-58" rx="50" ry="38" fill="#2F5D3A"/>
