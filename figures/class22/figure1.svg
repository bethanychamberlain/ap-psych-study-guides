<circle cx="0" cy="-186" r="22" fill="#2F5D3A"/>
<polygon points="8,-186 26,-182 8,-178" fill="#B8862B"/>
<circle cx="6" cy="-189" r="3" fill="#1F1D1A"/>
<polygon points="-22,0 -4,0 -14,16" fill="#B8862B"/>
<polygon points="4,0 22,0 12,16" fill="#B8862B"/>
</g>

<line x1="140" y1="630" x2="1260" y2="630" stroke="#6B6459" stroke-width="3" opacity="0.55"/>
<polygon points="1260,630 1240,620 1240,640" fill="#6B6459" opacity="0.55"/>

<text x="170" y="672" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#2F5D3A" text-anchor="middle">Prototype</text>
<text x="170" y="712" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#2F5D3A" text-anchor="middle">(most typical)</text>
<text x="1230" y="692" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#6B6459" text-anchor="middle">Edge member</text>
</svg>
