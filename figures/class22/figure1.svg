<line x1="8" y1="-18" x2="8" y2="0" stroke="#1F1D1A" stroke-width="4"/>
<line x1="-13" y1="0" x2="-3" y2="0" stroke="#1F1D1A" stroke-width="4"/>
<line x1="3" y1="0" x2="13" y2="0" stroke="#1F1D1A" stroke-width="4"/>
</g>

<!-- Bird 3: dove-like, plumper -->
<g transform="translate(594,560)">
<polygon points="-58,-68 -88,-88 -88,-48 -58,-60" fill="#2F5D3A"/>
<ellipse cx="0" cy="-64" rx="58" ry="46" fill="#2F5D3A"/>
