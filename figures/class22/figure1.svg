<line x1="10" y1="-22" x2="10" y2="0" stroke="#1F1D1A" stroke-width="5"/>
<line x1="-16" y1="0" x2="-4" y2="0" stroke="#1F1D1A" stroke-width="5"/>
<line x1="4" y1="0" x2="16" y2="0" stroke="#1F1D1A" stroke-width="5"/>
</g>

<!-- Bird 2: sparrow-like -->
<g transform="translate(382,560)">
