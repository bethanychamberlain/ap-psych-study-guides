<!-- Bird 6: penguin-like, edge member -->
<g transform="translate(1230,560)">
<polygon points="-46,-140 -74,-96 -50,-64" fill="#2F5D3A"/>
<polygon points="46,-140 74,-96 50,-64" fill="#2F5D3A"/>
