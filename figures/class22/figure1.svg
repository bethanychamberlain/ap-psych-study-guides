<line x1="-16" y1="0" x2="-4" y2="0" stroke="#1F1D1A" stroke-width="5"/>
<line x1="4" y1="0" x2="16" y2="0" stroke="#1F1D1A" stroke-width="5"/>
</g>

<!-- Bird 4: duck-like, flatter with a wide bill -->
<g transform="translate(806,560)">
<polygon points="-78,-50 -100,-68 -88,-38" fill="#2F5D3A"/>
<ellipse cx="0" cy="-50" rx="78" ry="40" fill="#2F5D3A"/>
