<polygon points="4,0 12,-8 20,0 12,6" fill="#1F1D1A"/>
</g>

<!-- Bird 5: long-necked, long-legged wading bird -->
<g transform="translate(1018,560)">
<ellipse cx="0" cy="-150" rx="48" ry="36" fill="#2F5D3A"/>
<path d="M -6,-184 C 10,-230 30,-280 46,-318 L 64,-314 C 50,-276 30,-226 16,-180 Z" fill="#2F5D3A"/>
