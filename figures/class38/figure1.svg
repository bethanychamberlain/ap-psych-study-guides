<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800">
  <rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>

  <!-- enclosure: ceiling bar, side posts, floor -->
  <line x1="220" y1="50" x2="1180" y2="50" stroke="#DDE5E0" stroke-width="6" stroke-linecap="round"/>
  <line x1="220" y1="50" x2="220" y2="680" stroke="#DDE5E0" stroke-width="6" stroke-linecap="round"/>
  <line x1="1180" y1="50" x2="1180" y2="680" stroke="#DDE5E0" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="680" x2="1260" y2="680" stroke="#6B6459" stroke-width="6" stroke-linecap="round"/>

  <!-- ground hatching -->
  <g stroke="#6B6459" stroke-width="3" stroke-linecap="round">
    <line x1="180" y1="694" x2="204" y2="714"/>
    <line x1="270" y1="694" x2="294" y2="714"/>
    <line x1="360" y1="694" x2="384" y2="714"/>
    <line x1="450" y1="694" x2="474" y2="714"/>
    <line x1="840" y1="694" x2="864" y2="714"/>
    <line x1="930" y1="694" x2="954" y2="714"/>
    <line x1="1020" y1="694" x2="1044" y2="714"/>
    <line x1="1110" y1="694" x2="1134" y2="714"/>
    <line x1="1200" y1="694" x2="1224" y2="714"/>
  </g>

  <!-- string from the ceiling to the banana -->
  <line x1="700" y1="50" x2="703" y2="76" stroke="#1F1D1A" stroke-width="3"/>

  <!-- banana, hanging out of reach -->
  <path d="M672,132 C678,94 718,76 762,96 C754,113 736,129 712,134 C696,138 681,137 672,132 Z" fill="#B8862B"/>

  <!-- crate, bottom -->
  <rect x="585" y="560" width="190" height="120" fill="#6B6459" stroke="#2F5D3A" stroke-width="4"/>
  <line x1="589" y1="564" x2="771" y2="676" stroke="#1F1D1A" stroke-width="5"/>
  <line x1="771" y1="564" x2="589" y2="676" stroke="#1F1D1A" stroke-width="5"/>

  <!-- crate, top -->
  <rect x="595" y="440" width="170" height="120" fill="#6B6459" stroke="#2F5D3A" stroke-width="4"/>
  <line x1="599" y1="444" x2="761" y2="556" stroke="#1F1D1A" stroke-width="5"/>
  <line x1="761" y1="444" x2="599" y2="556" stroke="#1F1D1A" stroke-width="5"/>

  <!-- chimpanzee silhouette, standing on the top crate, one arm reaching up -->
  <circle cx="680" cy="230" r="32" fill="#2F5D3A"/>
  <ellipse cx="680" cy="253" rx="16" ry="11" fill="#2F5D3A"/>
  <line x1="680" y1="262" x2="680" y2="365" stroke="#2F5D3A" stroke-width="22" stroke-linecap="round"/>
  <line x1="680" y1="365" x2="646" y2="440" stroke="#2F5D3A" stroke-width="18" stroke-linecap="round"/>
  <line x1="680" y1="365" x2="714" y2="440" stroke="#2F5D3A" stroke-width="18" stroke-linecap="round"/>
  <line x1="655" y1="278" x2="618" y2="368" stroke="#2F5D3A" stroke-width="16" stroke-linecap="round"/>
  <line x1="706" y1="278" x2="745" y2="150" stroke="#2F5D3A" stroke-width="16" stroke-linecap="round"/>

  <!-- label: banana out of reach -->
  <line x1="905" y1="112" x2="775" y2="112" stroke="#1F1D1A" stroke-width="3"/>
  <polygon points="775,112 793,104 793,120" fill="#1F1D1A"/>
  <text x="915" y="126" font-family="Figtree, Arial, sans-serif" font-size="40" font-weight="700" fill="#1F1D1A">banana out of reach</text>

  <!-- label: crates stacked after a pause -->
  <line x1="385" y1="600" x2="570" y2="600" stroke="#1F1D1A" stroke-width="3"/>
  <polygon points="582,600 564,590 564,610" fill="#1F1D1A"/>
  <text x="60" y="590" font-family="Figtree, Arial, sans-serif" font-size="40" font-weight="700" fill="#1F1D1A">crates stacked</text>
  <text x="60" y="636" font-family="Figtree, Arial, sans-serif" font-size="40" font-weight="700" fill="#1F1D1A">after a pause</text>
</svg>
