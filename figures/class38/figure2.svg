<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800">
  <rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>

  <!-- maze block: solid fill is wall, white is corridor -->
  <rect x="280" y="140" width="850" height="560" rx="28" fill="#2F5D3A"/>

  <!-- main corridor: the only through-path, start to goal -->
  <path d="M280,400 L480,400 L480,220 L720,220 L720,580 L960,580 L960,400 L1130,400"
        fill="none" stroke="#FFFFFF" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- dead-end branches: corridor stubs that go nowhere -->
  <path d="M480,340 L360,340" fill="none" stroke="#FFFFFF" stroke-width="90" stroke-linecap="round"/>
  <path d="M600,220 L600,330" fill="none" stroke="#FFFFFF" stroke-width="90" stroke-linecap="round"/>
  <path d="M840,580 L840,620" fill="none" stroke="#FFFFFF" stroke-width="90" stroke-linecap="round"/>

  <!-- the learned route: dashed ochre, start to goal, direction arrow at the goal end -->
  <path d="M230,400 L480,400 L480,220 L720,220 L720,580 L960,580 L960,400 L1170,400"
        fill="none" stroke="#B8862B" stroke-width="8" stroke-dasharray="20,14" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="1170,400 1150,390 1150,410" fill="#B8862B"/>

  <!-- start box -->
  <rect x="40" y="325" width="190" height="150" rx="16" fill="#FFFFFF" stroke="#2F5D3A" stroke-width="6"/>
  <text x="135" y="372" font-family="Figtree, Arial, sans-serif" font-size="44" font-weight="700" fill="#1F1D1A" text-anchor="middle">Start</text>

  <!-- rat silhouette, near the start -->
  <ellipse cx="123" cy="436" rx="38" ry="17" fill="#1F1D1A"/>
  <circle cx="167" cy="426" r="14" fill="#1F1D1A"/>
  <circle cx="160" cy="414" r="5" fill="#1F1D1A"/>
  <circle cx="174" cy="414" r="5" fill="#1F1D1A"/>
  <circle cx="180" cy="428" r="4" fill="#1F1D1A"/>
  <path d="M86,439 Q54,446 49,416" fill="none" stroke="#1F1D1A" stroke-width="6" stroke-linecap="round"/>

  <!-- goal box, with a food dish -->
  <rect x="1170" y="295" width="190" height="210" rx="16" fill="#FFFFFF" stroke="#2F5D3A" stroke-width="6"/>
  <text x="1265" y="342" font-family="Figtree, Arial, sans-serif" font-size="44" font-weight="700" fill="#1F1D1A" text-anchor="middle">Goal box</text>
  <ellipse cx="1265" cy="405" rx="55" ry="20" fill="#FFFFFF" stroke="#6B6459" stroke-width="4"/>
  <ellipse cx="1265" cy="399" rx="30" ry="13" fill="#B8862B"/>
  <text x="1265" y="468" font-family="Figtree, Arial, sans-serif" font-size="44" font-weight="700" fill="#1F1D1A" text-anchor="middle">food</text>

  <!-- dead-ends callout -->
  <text x="150" y="258" font-family="Figtree, Arial, sans-serif" font-size="44" font-weight="700" fill="#1F1D1A" text-anchor="middle">dead ends</text>
  <line x1="215" y1="278" x2="325" y2="322" stroke="#6B6459" stroke-width="4" stroke-linecap="round"/>
  <polygon points="330,324 313,322 318,312" fill="#6B6459"/>

  <!-- route legend -->
  <line x1="255" y1="758" x2="355" y2="758" stroke="#B8862B" stroke-width="8" stroke-dasharray="20,14" stroke-linecap="round"/>
  <text x="375" y="772" font-family="Figtree, Arial, sans-serif" font-size="44" font-weight="700" fill="#1F1D1A" text-anchor="start">the route learned without reward</text>
</svg>
