<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 19 figures</title>
<style>
:root { --ink: #1f2a24; --muted: #5b6b62; --rule: #d6ded9; --paper: #ffffff; --accent: #2c5f46; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink);
  font: 17px/1.55 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.wrap { max-width: 820px; margin: 0 auto; padding: 1.5rem 16px 3rem; }
.eyebrow { font: 600 0.75rem/1.2 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0; }
h1 { font-size: 1.6rem; margin: 0.3rem 0 0.6rem; }
.lede { color: var(--muted); margin: 0 0 1.5rem; }
figure { margin: 0 0 2.2rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
h2 { font-size: 1.1rem; margin: 0 0 0.8rem; }
img { display: block; max-width: 100%; height: auto; border: 1px solid var(--rule); }
figcaption { color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem; }
a { color: var(--accent); }
</style>
</head>

<p class="eyebrow">AP Psychology &middot; Class 19</p>
<h1>Figures from your class notes</h1>
<p class="lede">Sleep. These are the same figures as in your Class Notes, in the same order. If a figure in your notes shows as a gray box, use this page instead.</p>
<figure>
<h2>Slide 5. What Consciousness Is</h2>
<img src="figures/class19/figure1.svg" alt="Slide 5. What Consciousness Is: Awareness as a continuum, not a switch. NREM is sleep without rapid eye movement, REM is the dreaming stage." loading="lazy">
<figcaption>Awareness as a continuum, not a switch. NREM is sleep without rapid eye movement, REM is the dreaming stage.</figcaption>
</figure>
<figure>
<h2>Slide 6. The Clock Inside</h2>
<img src="figures/class19/figure2.svg" alt="Slide 6. The Clock Inside: Light reaches the eye, the eye sets the brain&#x27;s clock, and the clock&#x27;s melatonin signal sets sleep timing." loading="lazy">
<figcaption>Light reaches the eye, the eye sets the brain&#x27;s clock, and the clock&#x27;s melatonin signal sets sleep timing.</figcaption>
</figure>
